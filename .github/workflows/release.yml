name: Build release exe

# Publishing a release on GitHub (tag like v1.2.0) builds the Windows .exe
# and attaches it to that release. The app's Update button downloads it from there.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.version=${VERSION}" \
            -o BlayUGC-Wig-Tool.exe .
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" BlayUGC-Wig-Tool.exe --clobber -R "$GITHUB_REPOSITORY"
